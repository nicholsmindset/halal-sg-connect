[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SEO page redirects for programmatic pages
[[redirects]]
  from = "/category/:category"
  to = "/seo/:category"
  status = 200

[[redirects]]
  from = "/:district"
  to = "/seo/:district"
  status = 200
  
[[redirects]]
  from = "/:district/:category"
  to = "/seo/:district/:category"
  status = 200

[[redirects]]
  from = "/features/:feature"
  to = "/seo/features/:feature"
  status = 200

[[redirects]]
  from = "/price/:range"
  to = "/seo/price/:range"
  status = 200

# SEO files
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/generate-sitemap?type=sitemap"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/generate-sitemap?type=robots"
  status = 200

[[redirects]]
  from = "/sitemap_index.xml"
  to = "/.netlify/functions/generate-sitemap?type=sitemap-index"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"